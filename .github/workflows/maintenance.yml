name: Dependency and product discovery

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover and validate updates without changing the repository or opening PRs
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [routine, major, families]
    steps:
      - name: Checkout trusted maintenance code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover stable updates
        shell: pwsh
        env:
          UPDATE_KIND: ${{ matrix.kind }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: ./.github/scripts/Update-Maintenance.ps1 -Kind $env:UPDATE_KIND -DryRun:($env:DRY_RUN -eq 'true')
      - name: Upload proposed changes
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-${{ matrix.kind }}
          include-hidden-files: true
          path: |
            maintenance-result.json
            .github/powershell-dependencies.psd1
            EvergreenAdmx.ps1
            README.md
            CHANGELOG.md
            tests/EvergreenAdmx.Tests.ps1
          retention-days: 1

  publish-pr:
    needs: discover
    # A vendor discovery failure must not prevent unrelated dependency PRs.
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        kind: [routine, major, families]
    steps:
      - name: Checkout trusted publisher code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download changes from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-${{ matrix.kind }}
          path: ${{ runner.temp }}/maintenance
      - name: Open or refresh maintenance PR and run CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATH: ${{ runner.temp }}/maintenance
        run: ./.github/scripts/Publish-MaintenancePR.ps1 -ArtifactPath $env:ARTIFACT_PATH
